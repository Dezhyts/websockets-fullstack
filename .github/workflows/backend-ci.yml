name: Backend CI/CD

on:
  push:
    branches: ['**']
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['backend/**']

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: super_test_pass
          POSTGRES_DB: websockets_test
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: 'postgresql://postgres:super_test_pass@localhost:5433/websockets_test?schema=public'
      JWT_SECRET: 'test_secret_key'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Linter (ESLint)
        run: npm run lint
        working-directory: ./backend

      - name: Validate and Generate Prisma Client
        run: |
          npx prisma validate
          npx prisma generate
        working-directory: ./backend

      - name: Load Staging Schema Snapshot Test
        run: |
          docker exec ${{ job.services.postgres.id }} pg_isready -U postgres
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d websockets_test < ./prisma/staging-snapshot.sql
        working-directory: ./backend

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        working-directory: ./backend

      - name: Build NestJS Application
        run: npm run build
        working-directory: ./backend

      - name: Check for missing migrations
        run: npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema ./prisma/schema.prisma --exit-code
        working-directory: ./backend
