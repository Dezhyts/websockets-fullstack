name: websocket-fullstack

services:
  websockets-postgres:
    image: postgres:16-alpine
    container_name: websocket-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER_AUTH}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD_AUTH}
      POSTGRES_DB: ${DATABASE_NAME_AUTH}
    ports:
      - 5433:5432
    volumes:
      - websockets-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER_AUTH} -d ${DATABASE_NAME_AUTH}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - websockets-network

  websockets-redis:
    image: redis:7-alpine
    container_name: redis-websockets
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    volumes:
      - websockets-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - websockets-network

  livekit:
    image: livekit/livekit-server:v1.9
    container_name: livekit-server
    command: --config /livekit.yaml
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50000-50019:50000-50019/udp'
    volumes:
      - ./livekit.yaml:/livekit.yaml
    restart: always
    depends_on:
      websockets-redis:
        condition: service_healthy
    networks:
      - websockets-network

  livekit-ingress:
    image: livekit/ingress:v1.2
    container_name: livekit-ingress
    command: --config /ingress.yaml
    volumes:
      - ./ingress.yaml:/ingress.yaml
    ports:
      - '1935:1935'
      - '7887:7887'
    restart: always
    depends_on:
      websockets-redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - websockets-network

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: postgres-backup
    restart: always
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=websockets-postgres
      - POSTGRES_USER=${DATABASE_USER_AUTH}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD_AUTH}
      - POSTGRES_DB=${DATABASE_NAME_AUTH}
      - POSTGRES_CLUSTER=TRUE
      - POSTGRES_EXTRA_OPTS=
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - POSTGRES_SUFFIX=_all_projects
      - COMPRESS_LEVEL=0
      - BACKUP_UID=1000
      - BACKUP_GID=1000
    depends_on:
      websockets-postgres:
        condition: service_healthy
    networks:
      - websockets-network

  main-server:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: main-server
    env_file: .env
    ports:
      - '3000:3000'
    environment:
      - APP_MODE=api
      - DATABASE_URL=postgresql://${DATABASE_USER_AUTH}:${DATABASE_PASSWORD_AUTH}@websockets-postgres:5432/${DATABASE_NAME_AUTH}?schema=public
      - REDIS_HOST=websockets-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      websockets-postgres:
        condition: service_healthy
      websockets-redis:
        condition: service_healthy
    networks:
      - websockets-network

  worker-notification-server:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: worker-notification-server
    env_file: .env
    environment:
      - APP_MODE=worker
      - DATABASE_URL=postgresql://${DATABASE_USER_AUTH}:${DATABASE_PASSWORD_AUTH}@websockets-postgres:5432/${DATABASE_NAME_AUTH}?schema=public
      - REDIS_HOST=websockets-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    depends_on:
      websockets-postgres:
        condition: service_healthy
      websockets-redis:
        condition: service_healthy
    networks:
      - websockets-network

volumes:
  websockets-postgres-data:
  websockets-redis-data:

networks:
  websockets-network:
    driver: bridge
